<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f8a4f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sobat Pintar</title>
<style>
:root{--bg:#edf5f1;--solid:#f7fbf9;--card:rgba(255,255,255,.78);--tx:#10201a;--mut:#5b6e64;--pri:#0f8a4f;--on:#fff;--bd:rgba(15,138,79,.17);--warn:#c2410c;--g1:#0f8a4f;--g2:#0b7f86;--glow:rgba(15,138,79,.26);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#06100c;--solid:#0d1a15;--card:rgba(24,40,33,.62);--tx:#e9f5ef;--mut:#8fa89b;--pri:#34d399;--on:#04130c;--bd:rgba(52,211,153,.18);--warn:#fb923c;--g1:#34d399;--g2:#22d3ee;--glow:rgba(52,211,153,.3);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
header{padding:14px 14px 4px;font-size:18px;font-weight:700}
main{padding:8px 12px 150px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mut)}
button{font:inherit;color:var(--tx);cursor:pointer}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:11px 16px;font-weight:700}
.ghost{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:11px 16px}
.wide{width:100%;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:78px}
.tile span{color:var(--pri);font-weight:700}.tile small,.mut,small{color:var(--mut)}
.tile i{position:absolute;top:6px;right:6px;background:var(--pri);color:var(--on);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.habis{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.r{text-align:right}.warn{color:var(--warn)}.tot{font-size:17px;border:0}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:18px}
.bar{position:fixed;left:10px;right:10px;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--pri);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px #0003}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:12px 0;color:var(--mut);font-weight:600}nav button.on{color:var(--pri)}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--tx);max-height:88vh}
dialog::backdrop{background:#0008}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.acts button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button{border:1px solid var(--bd);background:var(--bg);border-radius:99px;padding:7px 12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.stat b{display:block;font-size:17px}
h3{margin:4px 0 8px}h4{margin:16px 0 4px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:99px;z-index:99;display:none}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;font:13px/1.4 ui-monospace,monospace;margin:0}

body{background:radial-gradient(60% 38% at 92% -4%,var(--glow),transparent 70%),radial-gradient(50% 30% at -8% 32%,var(--glow),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:16px 14px 6px}
header small{display:block;color:var(--mut);font-size:12px;line-height:1.1}
.lg{position:relative;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);display:grid;place-items:center;font-weight:800;font-size:21px;box-shadow:0 4px 16px var(--glow)}
.lg::after{content:"✦";position:absolute;top:-6px;right:-5px;font-size:13px;color:var(--g2)}
.brand{font-size:19px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card,.tile,.stat div,.bar,nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card,.tile,.stat div{border-radius:16px}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);box-shadow:0 6px 18px var(--glow)}
.btn,.tile,.ghost,.chips button{transition:transform .12s,box-shadow .2s}
.btn:active,.tile:active,.ghost:active{transform:scale(.95)}
.tile i{animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
.stat b{font-size:21px}
dialog{background:var(--solid);border:1px solid var(--bd);box-shadow:0 20px 60px #0006}
dialog[open]{animation:up .25s ease}
nav button.on{text-shadow:0 0 14px var(--glow)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><span class="lg">S</span><div><b class="brand">Sobat Pintar</b><small id="wn"></small></div></header>
<main id="v"></main>
<nav>
<button data-t="kasir" onclick="go('kasir')">Kasir</button>
<button data-t="produk" onclick="go('produk')">Barang</button>
<button data-t="utang" onclick="go('utang')">Utang</button>
<button data-t="lap" onclick="go('lap')">Laporan</button>
</nav>
<dialog id="dg"></dialog>
<div id="toast"></div>
<script>
const K='kasirwarung.v1';
let D={nama:'',produk:[],trx:[],utang:{}},tab='kasir',cart={},cartX=[],q='',rng='hari';
try{D=Object.assign(D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(x){}
D.biji=D.biji||{siomay:{stok:null,modal:0},batagor:{stok:null,modal:0},kemasan:0,per:1000,bonus:1,min:2000};
const $=id=>document.getElementById(id),dlg=$('dg');
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(x){alert('Penyimpanan penuh. Ekspor backup dulu.')}};
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const P=id=>D.produk.find(p=>p.id===id);
const total=()=>Object.keys(cart).reduce((a,id)=>a+cart[id]*P(id).harga,0)+cartX.reduce((a,c)=>a+c.harga,0);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1800)}
function go(t){tab=t;render()}
function render(){
 $('wn').textContent=D.nama||'';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('v').innerHTML={kasir:vKasir,produk:vProduk,utang:vUtang,lap:vLap}[tab]();
}
/* ---- KASIR ---- */
function grid(){
 if(!D.produk.length)return '<p class="mut">Belum ada barang. Buka tab Barang untuk menambah.</p>';
 return D.produk.filter(p=>p.nama.toLowerCase().includes(q.toLowerCase())).map(p=>`<button class="tile ${p.stok!=null&&p.stok<=0?'habis':''}" onclick="add('${p.id}')"><b>${e(p.nama)}</b><span>${rp(p.harga)}</span>${p.stok!=null?`<small>stok ${p.stok}</small>`:''}${cart[p.id]?`<i>${cart[p.id]}</i>`:''}</button>`).join('');
}
function vKasir(){
 const n=Object.values(cart).reduce((a,b)=>a+b,0)+cartX.length;
 return nomCard()+`<input placeholder="Cari barang..." value="${e(q)}" oninput="q=this.value;$('grid').innerHTML=grid()"><div id="grid" class="grid">${grid()}</div>`+
 (n?`<div class="bar"><div><b>${n} barang</b><br>${rp(total())}</div><button class="btn" onclick="keranjang()">Keranjang</button></div>`:'');
}
function add(id){const p=P(id);if(p.stok!=null&&(cart[id]||0)>=p.stok)return toast('Stok tidak cukup');cart[id]=(cart[id]||0)+1;render()}
function ubah(id,d){const p=P(id),n=(cart[id]||0)+d;if(d>0&&p.stok!=null&&n>p.stok)return toast('Stok tidak cukup');if(n<=0)delete cart[id];else cart[id]=n;render();keranjang()}
function keranjang(){
 const ids=Object.keys(cart);
 if(!ids.length&&!cartX.length){dlg.close();return}
 dlg.innerHTML=`<h3>Keranjang</h3>`+cartX.map((x,i)=>`<div class="row"><div>${e(x.nama)}</div><div class="qty"><b>${rp(x.harga)}</b><button onclick="cartX.splice(${i},1);render();keranjang()">×</button></div></div>`).join('')+ids.map(id=>{const p=P(id);return `<div class="row"><div>${e(p.nama)}<br><small>${rp(p.harga)}</small></div><div class="qty"><button onclick="ubah('${id}',-1)">−</button><b>${cart[id]}</b><button onclick="ubah('${id}',1)">+</button></div></div>`}).join('')+
 `<div class="row tot"><b>Total</b><b>${rp(total())}</b></div><div class="acts"><button class="ghost" onclick="cart={};cartX=[];dlg.close();render()">Kosongkan</button><button class="btn" onclick="bayar()">Bayar</button></div>`;
 if(!dlg.open)dlg.showModal();
}
function bayar(){
 const t=total();
 dlg.innerHTML=`<h3>Bayar ${rp(t)}</h3><div class="chips"><button onclick="uang(${t})">Uang pas</button>${[5000,10000,20000,50000,100000].map(x=>`<button onclick="uang(${x})">${x/1000}rb</button>`).join('')}</div>
 <label>Uang diterima<input id="byr" type="number" inputmode="numeric" oninput="kemb()"></label><div id="kmb" class="row tot"><b>Kembali</b><b>-</b></div>
 <div class="acts"><button class="ghost" onclick="keranjang()">Kembali</button><button class="btn" onclick="selesai(false)">Selesai</button></div>
 <h4>Atau catat sebagai utang</h4><input id="unm" placeholder="Nama pelanggan"><button class="ghost wide" onclick="selesai(true)">Catat utang</button>`;
}
function uang(x){$('byr').value=x;kemb()}
function kemb(){const k=(+$('byr').value||0)-total();$('kmb').innerHTML=`<b>${k<0?'Kurang':'Kembali'}</b><b class="${k<0?'warn':''}">${rp(Math.abs(k))}</b>`}
function selesai(ut){
 const t=total();let b=+$('byr').value||0,nm='';
 if(ut){nm=$('unm').value.trim();if(!nm)return toast('Isi nama pelanggan');b=0}else if(b<t)return toast('Uang kurang');
 const items=Object.keys(cart).map(id=>{const p=P(id);if(p.stok!=null)p.stok-=cart[id];return{id,nama:p.nama,qty:cart[id],harga:p.harga,modal:p.modal||0}});
 cartX.forEach(c=>{['siomay','batagor'].forEach(j=>{if(c[j]&&D.biji[j].stok!=null)D.biji[j].stok-=c[j]});items.push({id:c.id,nama:c.nama,jenis:c.jenis,qty:1,harga:c.harga,modal:c.modal,biji:c.biji,mb:c.mb})});
 const x={id:uid(),t:Date.now(),items,total:t,bayar:b,utang:nm||null};
 D.trx.push(x);if(nm)D.utang[nm]=(D.utang[nm]||0)+t;
 cart={};cartX=[];save();render();struk(x.id);
}
const teks=x=>`*${D.nama||'Warung'}*\n${new Date(x.t).toLocaleString('id-ID')}\n`+x.items.map(i=>`${i.biji?i.nama:i.nama+' '+i.qty+' x '+rp(i.harga)} = ${rp(i.qty*i.harga)}`).join('\n')+`\nTotal: ${rp(x.total)}`+(x.utang?`\nUTANG a.n. ${x.utang}`:`\nBayar: ${rp(x.bayar)}\nKembali: ${rp(x.bayar-x.total)}`)+'\nTerima kasih';
function struk(id){
 const x=D.trx.find(t=>t.id===id);if(!x)return;
 dlg.innerHTML=`<h3>Struk</h3><pre>${e(teks(x))}</pre><div class="acts"><button class="ghost" onclick="dlg.close()">Tutup</button><button class="ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText(teks(D.trx.find(t=>t.id==='${id}'))).then(()=>toast('Disalin'))">Salin</button><button class="btn" onclick="window.open('https://wa.me/?text='+encodeURIComponent(teks(D.trx.find(t=>t.id==='${id}'))))">WhatsApp</button></div>`;
 if(!dlg.open)dlg.showModal();
}
/* ---- BARANG ---- */
function vProduk(){
 return `<div class="acts"><button class="ghost" onclick="fsb()">Siomay & Batagor</button><button class="ghost" onclick="kalk()">Hitung modal</button></div>`+`<button class="btn wide" onclick="fp()">+ Tambah barang</button>`+D.produk.map(p=>`<div class="row card" onclick="fp('${p.id}')"><div><b>${e(p.nama)}</b><br><small>Modal ${rp(p.modal||0)} · Untung ${rp(p.harga-(p.modal||0))}</small></div><div class="r"><b>${rp(p.harga)}</b><br><small class="${p.stok!=null&&p.stok<=5?'warn':''}">${p.stok==null?'stok bebas':'stok '+p.stok}</small></div></div>`).join('');
}
function fp(id){
 const p=id?P(id):{nama:'',harga:'',modal:'',stok:null};
 dlg.innerHTML=`<h3>${id?'Ubah':'Tambah'} barang</h3><label>Nama<input id="fn" value="${e(p.nama)}"></label><label>Harga jual<input id="fh" type="number" inputmode="numeric" value="${p.harga}"></label><label>Harga modal<input id="fm" type="number" inputmode="numeric" value="${p.modal}"></label><label>Stok (kosongkan jika tidak dihitung)<input id="fs" type="number" inputmode="numeric" value="${p.stok==null?'':p.stok}"></label>
 <div class="acts">${id?`<button class="ghost" onclick="hapusP('${id}')">Hapus</button>`:''}<button class="ghost" onclick="dlg.close()">Batal</button><button class="btn" onclick="simpanP('${id||''}')">Simpan</button></div>`;
 dlg.showModal();
}
function simpanP(id){
 const nama=$('fn').value.trim(),harga=+$('fh').value;if(!nama||!harga)return toast('Isi nama dan harga');
 const o={nama,harga,modal:+$('fm').value||0,stok:$('fs').value===''?null:+$('fs').value};
 if(id)Object.assign(P(id),o);else D.produk.push({id:uid(),...o});
 save();dlg.close();render();
}
function hapusP(id){if(confirm('Hapus barang ini?')){D.produk=D.produk.filter(p=>p.id!==id);delete cart[id];save();dlg.close();render()}}
/* ---- UTANG ---- */
function vUtang(){
 const L=Object.entries(D.utang).filter(([,v])=>v>0);
 if(!L.length)return '<p class="mut">Tidak ada utang pelanggan.</p>';
 return `<div class="stat"><div><small>Total utang beredar</small><b>${rp(L.reduce((a,[,v])=>a+v,0))}</b></div></div>`+L.map(([n,v])=>`<div class="row card"><div><b>${e(n)}</b><br><small class="warn">${rp(v)}</small></div><button class="btn" data-n="${e(n)}" onclick="bayarU(this.dataset.n)">Bayar</button></div>`).join('');
}
function bayarU(n){
 dlg.innerHTML=`<h3>Bayar utang ${e(n)}</h3><p>Sisa: <b>${rp(D.utang[n])}</b></p><label>Jumlah dibayar<input id="ju" type="number" inputmode="numeric" value="${D.utang[n]}"></label><div class="acts"><button class="ghost" onclick="dlg.close()">Batal</button><button class="btn" id="ok">Simpan</button></div>`;
 $('ok').onclick=()=>{const j=+$('ju').value;if(!j||j<=0)return toast('Isi jumlah');D.utang[n]=Math.max(0,D.utang[n]-j);if(D.utang[n]<=0)delete D.utang[n];save();dlg.close();render();toast('Tercatat')};
 dlg.showModal();
}
/* ---- LAPORAN ---- */
function vLap(){
 const now=new Date(),s=new Date(now);s.setHours(0,0,0,0);
 if(rng==='7')s.setDate(s.getDate()-6);if(rng==='bln')s.setDate(1);
 const T=D.trx.filter(x=>x.t>=s.getTime()).sort((a,b)=>b.t-a.t);
 const omzet=T.reduce((a,x)=>a+x.total,0),laba=T.reduce((a,x)=>a+x.items.reduce((b,i)=>b+(i.harga-i.modal)*i.qty,0),0);
 const m={};T.forEach(x=>x.items.forEach(i=>{const k=i.jenis||i.nama;m[k]=(m[k]||0)+(i.biji||i.qty)}));
 const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5),tipis=D.produk.filter(p=>p.stok!=null&&p.stok<=5);
 return `<div class="chips">${[['hari','Hari ini'],['7','7 hari'],['bln','Bulan ini']].map(([k,l])=>`<button style="${rng===k?'background:var(--pri);color:var(--on)':''}" onclick="rng='${k}';render()">${l}</button>`).join('')}</div>
 <div class="stat"><div><small>Omzet</small><b>${rp(omzet)}</b></div><div><small>Laba kotor</small><b>${T.some(x=>x.items.some(i=>i.mb))?'modal belum diisi':rp(laba)}</b></div><div><small>Transaksi</small><b>${T.length}</b></div><div><small>Utang beredar</small><b>${rp(Object.values(D.utang).reduce((a,b)=>a+b,0))}</b></div></div>
 <h4>Terlaris</h4>${top.map(([n,c])=>`<div class="row"><span>${e(n)}</span><b>${c}</b></div>`).join('')||'<p class="mut">Belum ada penjualan.</p>'}
 <h4>Stok menipis</h4>${tipis.map(p=>`<div class="row"><span>${e(p.nama)}</span><b class="warn">${p.stok}</b></div>`).join('')||'<p class="mut">Aman.</p>'}
 <h4>Riwayat</h4>${T.slice(0,30).map(x=>`<div class="row" onclick="struk('${x.id}')"><span>${new Date(x.t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${x.utang?' · utang '+e(x.utang):''}</span><b>${rp(x.total)}</b></div>`).join('')||'<p class="mut">Kosong.</p>'}
 <h4>Pengaturan</h4><label>Nama warung (tampil di struk)<input value="${e(D.nama||'')}" onchange="D.nama=this.value.trim();save();render()"></label>
 <div class="acts"><button class="ghost" onclick="ekspor()">Ekspor backup</button><button class="ghost" onclick="$('imp').click()">Impor</button></div><input id="imp" type="file" accept=".json" hidden onchange="impor(this)">`;
}
function ekspor(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
 a.download='kasir-warung-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function impor(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.produk)||!Array.isArray(o.trx))throw 0;if(confirm('Ganti semua data dengan backup ini?')){D=Object.assign({nama:'',produk:[],trx:[],utang:{}},o);save();render();toast('Backup dipulihkan')}}catch(x){toast('File backup tidak valid')}};
 r.readAsText(f);
}
/* ---- SIOMAY & BATAGOR ---- */
let nom=0,kj='siomay',kbv='',kr=[{n:'',h:''}];
const B=()=>D.biji;
const jb=n=>n>=B().min?Math.floor(n/B().per)+B().bonus:0;
const pv=()=>!nom?'Ketik nominal atau pilih di atas':nom<B().min?'Minimal '+rp(B().min):'= '+jb(nom)+' biji';
function nomCard(){
 return `<div class="card"><b>Siomay / Batagor</b><input id="nom" type="number" inputmode="numeric" placeholder="Ketik nominal, misal 5000" value="${nom||''}" oninput="nom=+this.value||0;$('pv').textContent=pv()"><div class="chips">${[2000,3000,4000,5000,10000].map(x=>`<button onclick="nom=${x};$('nom').value=${x};$('pv').textContent=pv()">${x/1000}rb</button>`).join('')}</div><div id="pv" class="mut">${pv()}</div><div class="acts"><button class="btn" onclick="addB('Siomay')">Siomay</button><button class="btn" onclick="addB('Batagor')">Batagor</button><button class="ghost" onclick="addB('Campur')">Campur</button></div></div>`;
}
function addB(j,s){
 const n=jb(nom);if(!n)return toast(nom?'Minimal '+rp(B().min):'Isi nominal dulu');
 if(j==='Campur'&&s==null)return campur(n);
 const si=j==='Siomay'?n:j==='Batagor'?0:s,bt=n-si;
 for(const [k,v] of [['siomay',si],['batagor',bt]]){const st=B()[k].stok,used=cartX.reduce((a,c)=>a+(c[k]||0),0);if(st!=null&&used+v>st)return toast('Stok '+k+' tidak cukup')}
 const mb=(!B().siomay.modal&&si>0)||(!B().batagor.modal&&bt>0);
 const modal=si*B().siomay.modal+bt*B().batagor.modal+(+B().kemasan||0);
 cartX.push({id:uid(),jenis:j,nama:j==='Campur'?`Campur (${si} siomay, ${bt} batagor)`:`${j} ${n} biji`,harga:nom,modal,biji:n,siomay:si,batagor:bt,mb});
 nom=0;render();
}
function campur(n){
 dlg.innerHTML=`<h3>Campur ${n} biji</h3><label>Jumlah siomay<input id="cs" type="number" inputmode="numeric" value="${Math.ceil(n/2)}" oninput="$('cb').textContent=Math.max(0,${n}-(+this.value||0))"></label><p>Batagor: <b id="cb">${Math.floor(n/2)}</b> biji</p><div class="acts"><button class="ghost" onclick="dlg.close()">Batal</button><button class="btn" id="okc">Tambah</button></div>`;
 $('okc').onclick=()=>{const s=+$('cs').value;if(!(s>=0&&s<=n))return toast('Jumlah tidak sesuai');dlg.close();addB('Campur',s)};
 dlg.showModal();
}
function fsb(){
 const b=B(),f=(id,l,v)=>`<label>${l}<input id="${id}" type="number" inputmode="numeric" value="${v}"></label>`;
 dlg.innerHTML=`<h3>Siomay & Batagor</h3>${f('s1','Stok siomay (biji, kosong = tidak dihitung)',b.siomay.stok??'')}${f('s2','Stok batagor (biji)',b.batagor.stok??'')}${f('m1','Modal per biji siomay',b.siomay.modal||'')}${f('m2','Modal per biji batagor',b.batagor.modal||'')}${f('k1','Biaya kemasan per pembelian (plastik, saus)',b.kemasan||'')}<label>Aturan biji: Rp per biji / bonus biji / minimal beli<span style="display:flex;gap:6px"><input id="a1" type="number" value="${b.per}"><input id="a2" type="number" value="${b.bonus}"><input id="a3" type="number" value="${b.min}"></span></label><div class="acts"><button class="ghost" onclick="dlg.close()">Batal</button><button class="btn" onclick="simpanB()">Simpan</button></div>`;
 dlg.showModal();
}
function simpanB(){
 const v=id=>$(id).value,st=id=>v(id)===''?null:+v(id);
 Object.assign(B().siomay,{stok:st('s1'),modal:+v('m1')||0});Object.assign(B().batagor,{stok:st('s2'),modal:+v('m2')||0});
 B().kemasan=+v('k1')||0;B().per=+v('a1')||1000;B().bonus=+v('a2')||0;B().min=+v('a3')||0;
 save();dlg.close();render();toast('Tersimpan');
}
const ktot=()=>kr.reduce((a,r)=>a+(+r.h||0),0);
function kt(){const t=ktot(),b=+kbv||0;$('kh').innerHTML=`<span>Total ${rp(t)}</span><b>${b?rp(t/b)+' / biji':'-'}</b>`}
function kalk(){
 dlg.innerHTML=`<h3>Hitung modal</h3><div class="chips">${['siomay','batagor'].map(j=>`<button style="${kj===j?'background:var(--pri);color:var(--on)':''}" onclick="kj='${j}';kalk()">${j}</button>`).join('')}</div><small>Isi bahan yang terpakai untuk satu kali bikin</small>${kr.map((r,i)=>`<div style="display:flex;gap:6px"><input placeholder="Bahan" value="${e(r.n)}" oninput="kr[${i}].n=this.value"><input type="number" inputmode="numeric" placeholder="Rp" value="${r.h}" oninput="kr[${i}].h=this.value;kt()"></div>`).join('')}<button class="ghost wide" onclick="kr.push({n:'',h:''});kalk()">+ Bahan</button><label>Jumlah ${kj} yang jadi (biji)<input type="number" inputmode="numeric" value="${kbv}" oninput="kbv=this.value;kt()"></label><div class="row tot" id="kh"></div><div class="acts"><button class="ghost" onclick="dlg.close()">Tutup</button><button class="btn" onclick="pakaiK()">Pakai sebagai modal</button></div>`;
 kt();if(!dlg.open)dlg.showModal();
}
function pakaiK(){
 const t=ktot(),b=+kbv||0;if(!t||!b)return toast('Isi bahan dan jumlah biji');
 B()[kj].modal=Math.round(t/b);save();dlg.close();toast('Modal '+kj+' '+rp(B()[kj].modal)+' per biji');
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
